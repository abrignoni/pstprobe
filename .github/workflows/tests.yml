name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Standard library only: the tests run with nothing installed. On Linux they run under a
      # virtual display so the window's self-check runs too.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb && xvfb-run -a python -m unittest discover -s tests -v
      - if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v
