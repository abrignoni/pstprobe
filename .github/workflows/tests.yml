name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # 3.13: python.org's 3.14 for macOS ships Tk 9, which aborts the window test there
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Standard library only: the tests run with nothing installed. On Linux they run under a
      # virtual display; PSTPROBE_REQUIRE_GUI makes the window test fail rather than skip.
      - name: Install a virtual display for the window test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk xvfb
      - name: Run the tests (under a virtual display on Linux)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a python -m unittest discover -s tests -v; else python -m unittest discover -s tests -v; fi
        env:
          PSTPROBE_REQUIRE_GUI: "1"
